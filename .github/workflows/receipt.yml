name: Reprint receipt

on:
  schedule:
    - cron: "30 0 * * *"   # 06:00 IST daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["receipt/**"]

permissions:
  contents: write

jobs:
  print:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 receipt/generate.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "receipt-printer[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add receipt.svg
          git diff --cached --quiet || git commit -m "🧾 reprint receipt" && git push
